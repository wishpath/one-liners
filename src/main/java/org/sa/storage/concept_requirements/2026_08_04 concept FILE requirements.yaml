conceptFileGuidelines:
  objective:
    - store each concept as a self-contained evaluation unit
    - keep definitions extremely concise and laconic
    - capture essence with minimal wording
    - make user expectations and grading math explicit and mechanical
    - avoid ambiguity for user and evaluator
    - unit can should be able to stand alone, no extra context should be needed.

  fileFormat:
    type: plain text
    parsing:
      - file is read line-by-line
      - no line contains metadata or structure markers
      - no indentation, prefixes, or extra whitespace are allowed
      - each line represents data only
    structure:
      - line 1: key
      - line 2: description (canonical essence, that user wants to memorize)
      - line 3: user answer requirements (the way user will be asked about the concept)
      - line 4: ai evaluation instructions (the way ai will evaluate user answer, grading rubric)
      - line 5: topic (predefined)
    constraints:
      - exactly 5 lines per file
      - lines must appear in the defined order
      - no empty lines allowed
      - no leading or trailing spaces on any line
      -
  structure_relation_between_lines_2_3_4:
    objective: "Define the strict 1-to-1 data flow and structural alignment across lines 2, 3, and 4."
    core_principle: "Line 2 defines the knowledge, Line 3 prompts for it without revealing it, and Line 4 mechanically grades it."

    mapping_rules:
      - element_derivation (Line 2 -> Line 3 & 4):
        - Line 2 must be decomposed into 1 or more atomic, non-overlapping elements (e.g., target domain, action verbs, component type, acronym expansions).
        - Every element established in Line 2 MUST be represented in Line 3 and evaluated in Line 4.
        - Line 4 MUST NOT introduce evaluation criteria for concepts or facts not present in Line 2.
      - prompt_formulation (Line 2 -> Line 3):
        - Line 3 must convert each Line 2 element into a human-readable question or instruction item.
        - Line 3 must NEVER reveal or closely mirror the canonical phrasing of Line 2 elements.
        - If splitting Line 2 into separate elements would inevitably reveal the answer, Line 3 must collapse them into a single requirement: "*meaning of the concept".
      - evaluation_mechanics (Line 2 & 3 -> Line 4):
        - Line 4 maps each Line 3 prompt item directly back to its Line 2 benchmark answer.
        - Line 4 explicitly assigns point values (e.g., "3/10") to each element such that the sum equals 10/10.
        - Line 4 defines valid extended answers, synonyms, and minimum thresholds (e.g., ">= N items") directly matching the constraints stated in Line 3 and canonical truth of Line 2.

    data_flow_example:
      line2_definition: "framework that simplifies listing, designing, documenting, and testing RESTful web APIs"
      elements_breakdown:
        element_1:
          canonical_truth_line2: "framework"
          prompt_requirement_line3: "*name the type of software component it is"
          ai_evaluation_line4: "User has to correctly identify the type of software (framework) — score 3/10."
        element_2:
          canonical_truth_line2: "RESTful web APIs"
          prompt_requirement_line3: "*name which part of software it addresses"
          ai_evaluation_line4: "User has to identify which part of software it addresses (RESTful APIs) — score 3/10."
        element_3:
          canonical_truth_line2: "listing, designing, documenting, or testing"
          prompt_requirement_line3: "*provide at least one key function it supports"
          ai_evaluation_line4: "User has to provide at least one key function it supports (listing, designing, documenting, or testing) — score 4/10."
      perfect_score_math_formula_line4: "3/10 + 3/10 + 4/10 = 10/10"

  structure_by_each_line:
    line1_key:
      rules:
        semantic:
          - concept name only
          - lowercase unless proper noun or acronym
          - windows filename friendly
          - must exactly match filename
          - must be unique across all concepts
          - use " - " (space-hyphen-space) to join closely related concepts
          - optional parentheses may contain a context or hint
          - context or hint exists only to disambiguate meaning
          - context or hint must NOT reveal the definition
          - context or hint must avoid using the same words as the definition
          - context or hint should force the user to produce the defining terms themselves
          - key must never contain the answer implicitly or explicitly
        technical_validation:
          - key must not contain characters:
              - semicolon (;)
              - comma (,)
              - backslash (\)
              - forward slash (/)
              - colon (:)
              - asterisk (*)
              - question mark (?)
              - double quote (")
              - less-than sign (<)
              - greater-than sign (>)
              - vertical bar (|)
          - key must not end with a dot (.)
      evaluation_elements:
        - Whenever a concept key is an initialism, abbreviation, or acronym, each letter or component requiring expansion must be treated as a separate element and  each explicitly included in both the user answer instructions and the AI evaluation instructions.
        - For example in key "RPO (requirement)" separate elements that needs separate treatment and consideration are letters R, P and O
      examples:
        - "RPO (requirement)"
        - "CIF (regulation)"
        - "bean factory - application context"

    line2_description:
      rules:
        - one-line definition only
        - extremely concise, essence only
        - ideal length well below 140 characters
        - prefer 2–6 words; short sentence if unavoidable
        - acronyms and initialisms must be expanded here
        - expanded form must be capitalized
        - use long dash (—) after expanded acronym
        - lowercase unless proper noun
        - optional example or key detail only if it improves clarity
        - if explicitly instructed, line 2 must remain unchanged even if improvements are possible.
        - if a concept key is a name of any type of software component (application, software, platform, framework, library, service, tool, plugin, API, middleware, etc):
            - definition (line2) has to state what type of software components it is
      evaluation_elements:
        - clearly distinguish the separate elements that make up the definition, as these will directly correspond to the user instructions in line 3 and the AI evaluation in line 4
        - every element defined in line 2 must be reflected in line 3 and evaluated in line 4 unless intentionally omitted
      examples:
        - "Recovery Point Objective — max data loss measured in time."
        - "Critical Information Function — key system impacting financial operations."
        - "framework that simplifies listing, designing, documenting, and testing RESTful web APIs"

    line3_userRequirements:
      rules:
        - user answer instructions must directly correspond to the elements in the concept definition:
            - elements in user answer requirements has to never reveal any part of the answer
            - for concepts where breaking into multiple elements would reveal the answer, define a single element called *meaning of the concept
            - information used in evaluation (examples, clarifications, accepted answers) must not appear or be implied in user instructions
        - include EXACT key that has to be explained or defined or named or expanded, etc.
        - explicit instructions for how the user must answer, but not give out the answer
        - clearly state minimum requirements, but not give out the answer
        - quantify expectations where possible (counts, conditions)
        - written for humans, short and direct
        - try to not use the same words as in definition (user has to come up with these words himself)
        - do not use wording that directly or indirectly reveals the definition (including verbs or phrasing that imply the answer).
        - do not reuse or closely mirror wording from the definition; force user to produce terms independently.
        - avoid hinting the answer in user instructions whenever possible
        - do not instruct user how long should his answer be.
        - for initialisms, abbreviations and acronyms always ask to expand meaning of each letter and give a general narrative of a concept meaning.
        - always explicitly state when “>= N items are enough to receive full score for this element”.
        - use “exactly N” when full set is required; use “>= N” only when partial listing is acceptable.
        - when multiple definition elements exist, split them into separate questions instead of grouping.
        - do not include narrative or descriptive tasks unless they directly correspond to definition elements.
        - if a concept key is a name of any type of software component (application, software, platform, framework, library, service, tool, plugin, API, middleware, etc):
          - user instruction (line3) has to prompt user to name this software component type
      examples:
        - "Please name >=5 abstraction examples."
        - "Explain RPO. *Expand what each letter means? **R? **P? **O? *Provide a short narrative"
        - "Please describe concept 'Swagger': *name the type of software component it is *name which part of software it addresses *provide at least one key function it supports"

      userInstructionSyntax:
        purpose: "Explain the special markup used in user answer instructions for formatting."
        rules:
          - "**** → new line + 4 tabs"
          - "***  → new line + 3 tabs"
          - "**   → new line + 2 tabs"
          - "*    → new line + 1 tab"
        example:
          rawInstruction: "Explain RPO. *Expand what each letter means? **R? **P? **O? *Provide a short narrative"
          rendered:
            - "Explain RPO."
            - "    Expand what each letter means?"
            - "        R?"
            - "        P?"
            - "        O?"
            - "    Provide a short narrative"

    line4_aiEvaluation:
      rules:
        - line 4 must directly evaluate the target knowledge defined in line 2 (definition) by breaking it down into distinct, testable components called "elements".
          - an "element" is an individual, granular requirement derived from line 2 to line 3 (user prompt) and line 4 (AI evaluation)
            - each "element" maps directly to it's part in each: line 2, line 3 and line 4.
        - AI evaluation must directly correspond to both the definition and user answer instructions
        - list exact elements to check in the answer:
            - start with "User has to"
            - formulation should directly correspond to what was user asked about
            - specify the benchmark correct answer for each element based on line 2 (definition).
            - include valid extended examples, synonyms, or alternative correct phrasing if a user is likely to provide them (e.g., "accept 'RPO', 'Recovery Point Objective', or equivalent phrasing").
            - clearly define what constitutes the minimum correct answer for full score per element.
            - explicit point allocation per element:
              - evaluation point, example: "2/10"
              - do not avoid mentioning that for each element "add points in the math formula explicitly"
            - example: "User has to expand each letter correctly (Recovery Point Objective). Add points to score for each explicitly in the math formula (R=2/10, P=2/10, O=2/10). User has to correctly state what effect on information it measures (data loss) — score 2/10. User has to correctly state in what unit it is expressed (time) — score 2/10. Add points explicitly in the math formula. Perfect score math formula: 2/10 + 2/10 + 2/10 + 2/10 + 2/10 = 10/10."
        - do include math formula of perfect score:
            - explicit math showing how 10/10 is reached
            - do state that it is a math formula
            - example : "Perfect score math formula: 2/10 + 2/10 + 2/10 + 1/10 + 3/10 = 10/10."
            - all points in the evaluation must be whole numbers like this "1/10" and never use fractions or halves
            - for repeated elements, prefer expressions like “N * X/10” instead of listing each addition separately.
            - assign points per individual element rather than grouping multiple elements under one score.
            - assign different weights to elements based on importance, ensuring total equals 10/10
            - every evaluated element must directly correspond to a requirement from line 3; no extra evaluation criteria allowed.
        - no interpretation or subjective judgment
        - clearly define what constitutes the minimum correct answer for full score per element
      examples:
        - "User has to expand each letter correctly (Elasticsearch, Logstash, Kibana). Add points to score for each explicitly in the math formula (E=2/10, L=2/10, K=2/10). User has to correctly identify the target they work with (logs) — score 1/10. User has to correctly identify >=3 performed actions (collect, ingest, parse, transform, store, index, search, analyze, visualize) (1/10 point per verb). Any 3 correct verbs are enough for a maximum score of 3/10 for this part (3 * 1/10). Add points explicitly in the math formula. Perfect score math formula: 3 * 2/10 + 1/10 + 3 * 1/10 = 10/10."
        - "User has to mention at least 5 abstraction examples (function, API, interface, class, OS, database, VM, microservice, file system, data structure, module, package, framework, ORM, container). For each correct abstraction example user gets 2/10 points. 5 examples are enough to provide 10/10 evaluation. Add points in the math formula explicitly. Perfect score math formula: '5 * 2/10 = 10/10'."
        - "User has to correctly identify the type of software (framework) — score 3/10. User has to identify which part of software it addresses (RESTful APIs) — score 3/10. User has to provide at least one key function it supports (listing, designing, documenting, or testing) — score 4/10. Add points explicitly in the math formula. Perfect score math formula: 3/10 + 3/10 + 4/10 = 10/10."

    line5_topic:
      rules:
        - exactly one topic must be assigned
        - topic must be chosen from the predefined list
        - no variants, aliases, or comments allowed
      allowedTopics:
        - algorithmsCodingAndStructures
        - apis
        - backend
        - businessAndWorkplace
        - ciCdAndDevOps
        - containerisation
        - databases
        - domainDrivenDesign
        - frontend
        - generalITTerms
        - hardware
        - javaAndSpring
        - logsAndObservability
        - networking
        - qaAndTesting
        - regulations
        - workUsefulEnglish

  preservedPrinciples:
    - brevity over precision
    - essence over completeness
    - shorter and slightly unclear preferred over longer and precise
    - definitions must stand alone
    - evaluation must be reproducible and deterministic

examples: |
  === START NON-CONFORMING BLOCK ===
  
  abstraction examples
  interfaces, modules, packages, APIs, frameworks, ORMs, microservices, VMs, containers.
  Please name >=5 abstraction examples.
  User has to mention at least 5 abstraction examples. For each correct abstraction example user gets 2/10 points. 5 examples are enough to provide 10/10 evaluation. Add points in the math formula explicitly. Perfect score math formula: '5 * 2/10 = 10/10'.
  algorithmsCodingAndStructures
  
  
  RPO (requirement)
  Recovery Point Objective — maximum data loss allowed, measured in time, e.g., 15 minutes.
  Explain RPO (requirement). *Expand what each letter means? **R? **P? **O? *Provide a short narrative
  User has to expand each letter correctly. Add points to score for each explicitly in the math formula (R=3/10, P=3/10, O=3/10). User has to include a short note on the concept meaning - you score it (1/10) and add points to this point explicitly in the math formula. Perfect score math formula: 3/10 + 3/10 + 3/10 + 1/10= 10/10.
  ciCdAndDevOps
  
  
  abstraction
  process of hiding complex details, exposing only essential features to manage complexity.
  Please describe concept 'abstraction': *what it hides *what it exposes
  User has to correctly identify what abstraction hides (complex details) — score 5/10. User has to correctly identify what it exposes (essential features) — score 5/10. Add points explicitly in the math formula. Perfect score math formula: 5/10 + 5/10 = 10/10.
  algorithmsCodingAndStructures
  
  
  boilerplate
  sections of code that have to be included in many places with little or no alteration.
  Please describe concept 'boilerplate': *meaning of the concept
  User has to explain the general meaning of the concept. Award full score (10/10) if the answer captures the concept. Perfect score math formula: 10/10.
  algorithmsCodingAndStructures
  
  
  cohesion example
  UserManager class with createUser, deleteUser methods — focused on single responsibility.
  Please describe a 'cohesion example': *concrete structure elements *quality it focuses on
  User has to describe any concrete structure and elements in the example — score 5/10. User has to correctly identify the quality it focuses on (e.g., elements work closely together, single responsibility) — score 5/10. Add points explicitly in the math formula. Perfect score math formula: 5/10 + 5/10 = 10/10.
  algorithmsCodingAndStructures
  
  
  defensive programming
  Ensuring software behaves as expected even when encountering unexpected inputs or conditions.
  Please describe concept 'defensive programming': *situation it addresses *intended behavior
  User has to describe the situation it addresses (unexpected inputs or conditions) — score 5/10. User has to describe the intended behavior (software continues to behave as expected) — score 5/10. Add points explicitly in the math formula. Perfect score math formula: 5/10 + 5/10 = 10/10.
  algorithmsCodingAndStructures
  
  
  deterministic
  Same input will always produce the same outcome.
  Please describe concept 'deterministic': *what inputs are like? *what is result like?
  User has to describe the behavior of inputs (same input) — score 5/10. User has to describe the consistency of results (always same outcome) — score 5/10. Add points explicitly in the math formula. Perfect score math formula: 5/10 + 5/10 = 10/10.
  algorithmsCodingAndStructures
  
  
  dispose of a list
  Release the list and its resources.
  Please describe concept 'dispose of a list': *intended effect
  User has to describe the intended effect (freeing or releasing associated resources) — score 10/10. Add points explicitly in the math formula. Perfect score math formula: 10/10.
  algorithmsCodingAndStructures
  
  
  DRY
  Don't Repeat Yourself — programming principle promoting avoidance of duplicate code or logic.
  Explain DRY (principle). *Expand what each letter means? **D? **R? **Y? *Provide a short narrative
  User has to expand each letter correctly. Add points to score for each explicitly in the math formula (D=3/10, R=3/10, Y=3/10). User has to include a short note on the concept meaning — you score it (1/10) and add points to this point explicitly in the math formula. Perfect score math formula: 3/10 + 3/10 + 3/10 + 1/10 = 10/10.
  algorithmsCodingAndStructures
  
  
  DSL
  Domain-Specific Language — syntax tailored to a non-general domain. Example: Thymeleaf provides DSL for HTML.
  Explain DSL. *Expand what each letter means? **D? **S? **L? *Provide a short narrative
  User has to expand each letter correctly. Add points to score for each explicitly in the math formula (D=2/10, S=2/10, L=2/10). User has to include a short note on the concept meaning — you score it (4/10) and add points to this point explicitly in the math formula. Perfect score math formula: 2/10 + 2/10 + 2/10 + 4/10 = 10/10.
  algorithmsCodingAndStructures
  
  
  Swagger
  framework that simplifies listing, designing, documenting, and testing RESTful web APIs
  Please describe concept 'Swagger': *name the type of software component it is *name which part of software it addresses *provide at least one key function it supports
  User has to correctly identify the type of software (framework) — score 3/10. User has to identify which part of software it addresses (RESTful APIs) — score 3/10. User has to provide at least one key function it supports (listing, designing, documenting, or testing) — score 4/10. Add points explicitly in the math formula. Perfect score math formula: 3/10 + 3/10 + 4/10 = 10/10.
  apis
  
  === END NON-CONFORMING BLOCK ===